<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#F8F3ED" />
    <meta name="description" content="With the blessings of our families, we joyfully invite you to celebrate the engagement ceremony of Ansiya and Nihal on Sunday, 29 November 2026." />
    
    <!-- Open Graph & Social Meta -->
    <meta property="og:title" content="Ansiya & Nihal | Engagement Ceremony Celebration" />
    <meta property="og:description" content="With the blessings of our families, we joyfully invite you to celebrate the engagement ceremony of Ansiya and Nihal on Sunday, 29 November 2026." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23FDFBF7' stroke='%23A8833F' stroke-width='1.5'/><text x='16' y='21' font-family='serif' font-size='11' fill='%234A3730' text-anchor='middle'>A%26N</text></svg>" />

    <!-- Google Fonts: Cormorant Garamond (300, 400, italic 300, 400) & Jost (300, 400) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">

    <title>Ansiya & Nihal | Engagement Invitation</title>

    <style>
      /* Zero-JS Instant Initial State (Prevents blank white screen on mobile) */
      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: #F8F3ED;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999;
      }
      .loader-monogram {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background-color: #FDFBF7;
        border: 1px solid #A8833F;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.25rem;
        color: #4A3730;
        letter-spacing: 0.1em;
        animation: loaderBreathe 2s ease-in-out infinite;
      }
      @keyframes loaderBreathe {
        0%, 100% { opacity: 0.7; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1.02); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" aria-hidden="true">
        <div class="loader-monogram">
          A <span style="color: #A8833F; font-style: italic; margin: 0 2px;">&</span> N
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
