<html lang="en">
  <head>

    <meta name="theme-color" content="#F8F3ED" />
    <meta name="description" content="Two Hearts, One Beautiful Beginning. You are warmly invited to celebrate our engagement ceremony on Sunday, 29 November 2026." />

    <!-- Performance: Preload Critical Opening Screen Asset -->

    <!-- Google Fonts: Cormorant Garamond, Playfair Display, Jost, Great Vibes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <title>Siya & Nihal | Engagement Ceremony Invitation</title>

    <style>
      /* Zero-JS Instant Initial State (Prevents blank white screen on mobile) */
      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: #F8F3ED;
        display: flex;
        flex-direction: column;
        align-items: center;
        justifyContent: center;
        z-index: 999;
      }
      .loader-seal {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #F4ECE1;
        border: 1px solid rgba(198, 163, 107, 0.4);
        display: flex;
        align-items: center;
        justifyContent: center;
        animation: pulseFade 1.6s ease-in-out infinite;
      }
      @keyframes pulseFade {
        0%, 100% { opacity: 0.6; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1.03); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" aria-hidden="true">
        <div class="loader-seal">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#C6A36B">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
