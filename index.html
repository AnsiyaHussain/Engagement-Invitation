    <style>
      /* Zero-JS Instant Initial State (Prevents blank white screen on mobile) */
      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: #FFF8F1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999;
      }
      .loader-monogram {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background-color: #FFF8F1;
        border: 1px solid #C49A50;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.25rem;
        color: #7A1F3D;
        letter-spacing: 0.1em;
        animation: loaderBreathe 2s ease-in-out infinite;
      }
      @keyframes loaderBreathe {
        0%, 100% { opacity: 0.7; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1.02); }
      }
    </style>
